# Tunable settings. Calibration (Claude Code + your marks) edits this file.
# Threshold / caps / kill switch / test_mode live in locked.yaml.

stream:
  url: ""                         # stream URL or channel /live URL (https://www.youtube.com/@channel/live)
  format: "bv*[height<=720]+ba/b[height<=720]"   # live YouTube: 2 URLs (video + audio playlists)
  live_poll_s: 60                 # how often to check whether the channel is live
  ytdlp_timeout_s: 180            # kill a yt-dlp call that takes longer than this

recorder:
  chunk_seconds: 300
  stall_seconds: 60               # chunk file not growing for this long => reconnect
  reconnect_backoff_s: [5, 10, 30, 60]
  end_confirm_checks: 3           # consecutive "not live" answers before declaring end
  end_check_interval_s: 20        # wait between those "is it still live?" checks
  poll_s: 1.0                     # main loop period (segment list tail, stall check, heartbeat)
  min_chunk_s: 1.0                # partial chunk (after stall/exit/end) kept only if at least this long
  input_args: []                  # extra ffmpeg options placed before each -i (tests use ["-re"])
  ffmpeg_loglevel: warning        # ffmpeg stderr goes to data/logs/recorder_ffmpeg.log

analysis:
  frame_interval_s: 3             # one frame every 3 s for Claude
  frame_size: [320, 180]
  grid_cols: 4
  grid_rows: 5                    # 20 frames per grid, 5 grids per 5-minute chunk
  motion_fps: 2
  motion_size: [64, 36]
  letterbox_rows_frac: 0.10       # top/bottom band height checked for black bars
  letterbox_luma_max: 20          # band mean luma below this (0..255) counts as black
  audio_rate: 16000
  audio_hop_s: 0.5
  audio_block_s: 10
  baseline_minutes: 10            # rolling "recent average" window
  radio_min_s: 20                 # tonal stretch at least this long => radio/music
  # --- audio analysis tunables (clipper/analysis/audio.py; module defaults apply if absent)
  audio_frame: 1024               # FFT frame in samples (64 ms at 16 kHz)
  audio_silence_db: -60.0         # hops below this dBFS are silence (no spikes, not in baseline)
  audio_mad_floor_db: 3.0         # minimum baseline spread used by loud_z
  audio_spike_ref_s: 10.0         # "recent loudness" window before each hop
  audio_spike_min_db: 6.0         # jump over recent level where spike starts rising
  audio_spike_range_db: 18.0      # further jump for spike = 1
  audio_spike_above_db: 6.0       # dB above the stream baseline median for full spike
  audio_tonal_spike_weight: 0.4   # spike multiplier for a purely tonal jump (music starting)
  audio_onset_min_db: 9.0         # 16 ms envelope rise where transient starts rising
  audio_onset_range_db: 18.0      # further rise for transient = 1
  audio_flat_tonal: 0.01          # spectral flatness at/below => fully tonal
  audio_flat_noisy: 0.2           # spectral flatness at/above => fully broadband
  audio_transient_gate_db: 6.0    # transient gate: 0 at baseline median minus this, 1 at the median
  audio_music_flatness_max: 0.05  # music hops: flatness at most this
  audio_music_stability_min: 0.9  # music hops: consecutive-spectrum similarity at least this
  audio_music_onset_max_db: 9.0   # music hops: median envelope rise (~1 s) at most this
  audio_music_level_dev_db: 6.0   # music hops: level within this of the +-5 s median
  audio_music_gap_s: 2.0          # non-tonal gaps this short inside music are bridged
  audio_swell_rise_db: 3.0        # rise vs the quietest point 5-15 s earlier for full swell
  audio_swell_level_db: 12.0      # music this far above the stream baseline gives full swell
  audio_baseline_res_s: 1.0       # resolution of the baseline ring stored in state.kv
  hud_ref_max_images: 6

scoring:
  peak_min_gap_s: 20
  pre_roll_s: 6                   # clip starts this long before the peak
  clip_min_s: 20
  clip_max_s: 45
  cutscene_min_s: 30
  letterbox_share: 0.6            # share of window with bars => cutscene track
  gameplay_weights:
    audio_spike: 30
    action: 25
    hud_events: 20
    sound_type: 15
    duration: 10
  cutscene_weights:
    title_text: 30
    spectacle: 25
    newness: 25
    music_swell: 20
  penalties:
    menu_loading: 30              # points removed when window is mostly menu/map/loading
    repeat: 25                    # points removed for a repeat
    radio_audio_factor: 0.3       # audio_spike/sound_type multiplied by this inside radio
  repeat_window_s: 60
  judge_weight: 0.3               # final = (1-w)*signal + w*rating*10
  judge_frames: 4
  # --- added by the scoring module (activity curve / candidate detection) ---
  activity_weights:               # per-second activity curve used to find peaks
    audio: 0.4                    # spike / transient (radio-masked)
    motion: 0.3                   # motion + cuts + flashes + shake
    ai: 0.3                       # Claude action / HUD events / title text (dropped if Claude unavailable)
    letterbox: 0.3                # additive bonus while bars are on screen
  activity_min: 0.25              # peaks below this activity are ignored
  sustain_frac: 0.5               # window extends while activity >= this share of the peak
  max_window_overlap: 0.5         # a weaker peak whose window overlaps a stronger one more than this is skipped
  sustain_level: 0.35             # activity counted as "action" for the duration signal
  sustain_full_s: 8               # this many sustained seconds => duration signal 1.0
  burst_full: 6                   # this many separate transient bursts => full burst credit in sound_type
  ai_action_blend: 0.5            # action signal = (1-b)*CV + b*Claude action (when Claude is available)
  newness_decay: 0.5              # newness = decay ** times the scene_tag was already selected
  scene_repeat_window_s: 120      # same scene_tag as a selected clip within this many seconds => repeat
  judge_frame_width: 1280         # judge stills width (px)

production:
  width: 1080
  height: 1920
  fg_height: 608                  # 1080 x 608 full frame in the middle
  bg_blur_size: [54, 96]          # shrink to this then enlarge => blur
  hook_top_px: 220
  hook_font_size: 72
  hook_max_chars: 40
  font_path: "C:/Windows/Fonts/arialbd.ttf"
  nvenc:
    preset: p5
    cq: 23
    maxrate: "10M"
    bufsize: "20M"
  audio_bitrate: "192k"
  audio_fade_s: 1.0
  music_volume: 0.8
  duck_volume: 0.25               # game audio level under music bed for ducked cutscene types
  duck_scene_types: []            # scene tags that keep getting claimed
  duck_tracks: [cutscene]         # tracks where duck_scene_types applies
  hook_min_font_size: 40          # hook auto-shrinks down to this before truncating
  hook_max_lines: 2
  hook_margin_px: 60              # left/right margin for the hook text
  hook_stroke_ratio: 0.11         # black outline width = font size * ratio
  crop_right_px: 8                # h264_metadata crop (overlay_cuda codes 1088 wide); re-fixed after probe if off
  render_timeout_s: null          # null = max(180, 8 x clip length)
  gpu_retry_wait_s: 30            # run_gpu wait between retries while the GPU is unavailable
  gpu_max_wait_s: null            # null = keep waiting (never a CPU fallback)

publish:
  slot_hours: 2.4                 # one Short every 2.4 h  (2 to 3 h)
  first_slot_delay_min: 30
  daily_upload_limit: 100
  upload_backups: true            # 50-74 clips uploaded unlisted after the day's scheduled posts
  category_id: "20"               # Gaming
  game_name: "GTA 6"
  base_hashtags: ["#Shorts", "#GTA6"]
  default_language: "en"
  delete_after_upload: false      # delete the local .mp4 after a successful upload (sidecar .json kept)
  timezone: ""                    # time zone for per-day caps: "" = laptop's zone, "UTC", or an IANA name
  audit_passed: false             # set true once the YouTube API audit passes (silences the daily "uploads stay private" reminder)

supervisor:
  heartbeat_s: 30
  hang_s: 120
  backoff_s: [5, 15, 30, 60, 120, 300]
  stable_reset_s: 600
  crash_window_s: 600
  crash_count: 3
  max_repairs_per_stream: 3
  repair_timeout_s: 1800
  repair_test_timeout_s: 900
  startup_grace_s: 120
  poll_s: 1.0
  mem_log_s: 300
  slow_restart_s: 900
  log_tail_lines: 200

claude:
  model: claude-sonnet-5-5
  effort_grid: low
  effort_judge: medium
  effort_repair: high
  effort_report: low
  timeout_s: 300
